[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "A local-first, observable LLM proxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy[asyncio]>=2.0.38,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pgvector>=0.3.6,<1",
    "sentence-transformers>=3,<6",
    "transformers>=4.41,<5",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "coverage>=7.9,<8",
    "aiosqlite>=0.20,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.coverage.run]
branch = true
# SQLAlchemy's async bridge uses greenlet switches; tracing must account for them.
concurrency = ["thread", "greenlet"]
core = "ctrace"
source = ["app"]
omit = ["app/db/migrations/*"]

# CPU wheels keep this free local project usable without CUDA or a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
